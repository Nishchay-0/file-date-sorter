name: smart_file_organizer
description: "Smart File Organizer Suite Pro - Cross-Platform (Android, Windows, macOS)"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # File & Storage Utilities
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  path: ^1.9.0
  permission_handler: ^11.3.0
  shared_storage: ^0.7.0     # Android Scoped Storage (Storage Access Framework)
  
  # Hashing & Compression (System Vault)
  crypto: ^3.0.3
  archive: ^3.4.10
  
  # Icons & Glassmorphism UI
  cupertino_icons: ^1.0.6
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
