name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Official Android Platform Files
        working-directory: ./flutter_app
        run: |
          rm -rf android
          flutter create --platforms=android --org com.nishchay .
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          with open(p, "r") as f:
              content = f.read()
          perms = """    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n"""
          content = content.replace("<application", perms + "    <application")
          with open(p, "w") as f:
              f.write(content)
          '

      - name: Get Dependencies
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Run Dart Unit Tests
        working-directory: ./flutter_app
        run: flutter test

      - name: Build Android APK
        working-directory: ./flutter_app
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartFileOrganizer-Android-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
