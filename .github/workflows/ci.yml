name: Smart File Organizer Suite CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Master Deployment Test Suite
      run: |
        python test_deployment.py

    - name: Run Filename Embedded Dates Test Suite
      run: |
        python test_filename_dates.py

    - name: Run Folder Suite Tests
      run: |
        python test_folder_suite.py

    - name: Run Duplicate Verification Suite
      run: |
        python test_full_duplicate_tool_verification.py

    - name: Run Sorter Core Unit Tests
      run: |
        python test_sorter.py

    - name: Run Super Duplicates & Similarity Suite
      run: |
        python test_super_duplicates.py
