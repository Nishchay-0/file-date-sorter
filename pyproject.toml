[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-file-organizer"
version = "1.0.0"
description = "High-performance desktop GUI & CLI utility for organizing, deduplicating, batch renaming, converting, and indexing files and media."
authors = [{ name = "Smart File Organizer Team" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "customtkinter>=5.2.0",
    "Pillow>=9.0.0",
    "send2trash>=1.8.0",
    "watchdog>=3.0.0",
    "pystray>=0.19.0",
    "onnxruntime>=1.14.0",
    "opencv-python>=4.6.0",
    "scikit-learn>=1.0.0",
    "numpy>=1.21.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311", "py312", "py314"]
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | scratch
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
